name: Refresh WhatsApp Token

on:
  schedule:
    - cron: '0 0 */50 * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh token via Facebook Graph API
        id: refresh
        run: |
          RESPONSE=$(curl -s -X GET \
            "https://graph.facebook.com/v22.0/oauth/access_token?grant_type=fb_exchange_token&client_id=${{ secrets.FACEBOOK_APP_ID }}&client_secret=${{ secrets.FACEBOOK_APP_SECRET }}&fb_exchange_token=${{ secrets.WHATSAPP_ACCESS_TOKEN }}")
          echo "Facebook response: $RESPONSE"
          if echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))" | grep -q .; then
            NEW_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
            echo "new_token=$NEW_TOKEN" >> $GITHUB_OUTPUT
          else
            echo "ERROR: Token refresh failed"
            echo "$RESPONSE"
            exit 1
          fi

      - name: Update Vercel env var
        run: |
          curl -s -X POST \
            "https://api.vercel.com/v1/projects/prj_iYOcdl2ZAz2J7L30pE9odPWFVFsd/env?teamId=team_XKz4Ks7PaIPqckT8CRAtUS4m&upsert=true" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"key":"WHATSAPP_ACCESS_TOKEN","value":"${{ steps.refresh.outputs.new_token }}","type":"encrypted","target":["production"]}'

      - name: Redeploy
        run: |
          curl -s -X POST \
            "https://api.vercel.com/v1/deployments?teamId=team_XKz4Ks7PaIPqckT8CRAtUS4m" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"campoenorden-api","projectId":"prj_iYOcdl2ZAz2J7L30pE9odPWFVFsd","target":"production","forceNew":1}'
