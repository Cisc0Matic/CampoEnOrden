<div class="auth-wrapper">
  <div class="auth-logo">
    <ion-icon name="key" color="primary"></ion-icon>
    <h1>Nueva contraseña</h1>
    <p>Elegí una contraseña segura</p>
  </div>

  <div *ngIf="done" class="success-card">
    <ion-icon name="checkmark-circle" color="success"></ion-icon>
    <p>Contraseña actualizada exitosamente.</p>
    <ion-button fill="clear" routerLink="/login">Iniciar sesión</ion-button>
  </div>

  <form *ngIf="!done" class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <ion-list lines="none">
      <ion-item>
        <ion-input
          label="Nueva contraseña"
          labelPlacement="stacked"
          formControlName="password"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Mínimo 8 caracteres"
          autocomplete="new-password"
        ></ion-input>
        <ion-icon
          slot="end"
          [name]="showPassword ? 'eye-off' : 'eye'"
          (click)="togglePassword()"
          class="password-icon"
        ></ion-icon>
      </ion-item>
      <ion-item>
        <ion-input
          label="Confirmar contraseña"
          labelPlacement="stacked"
          formControlName="password_confirm"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Repetí la contraseña"
          autocomplete="new-password"
        ></ion-input>
      </ion-item>
    </ion-list>

    <ion-button expand="block" type="submit" class="submit-btn" [disabled]="loading || !token">
      <ion-spinner *ngIf="loading" name="dots"></ion-spinner>
      <span *ngIf="!loading">Guardar contraseña</span>
    </ion-button>

    <ion-text color="danger" *ngIf="errorMessage" class="error-message">
      <p>{{ errorMessage }}</p>
    </ion-text>
  </form>
</div>
