<div class="auth-wrapper">
  <div *ngIf="state === 'loading'" class="center">
    <ion-spinner name="dots" color="primary"></ion-spinner>
    <p>Activando tu cuenta...</p>
  </div>

  <div *ngIf="state === 'success'" class="success-card">
    <ion-icon name="checkmark-circle" color="success"></ion-icon>
    <h2>¡Cuenta activada!</h2>
    <p>Tu cuenta está lista. Ya podés iniciar sesión.</p>
    <ion-button routerLink="/login">Iniciar sesión</ion-button>
  </div>

  <div *ngIf="state === 'error'" class="error-card">
    <ion-icon name="close-circle" color="danger"></ion-icon>
    <h2>Error de activación</h2>
    <p>{{ errorMessage }}</p>
    <ion-button fill="outline" routerLink="/login">Volver al inicio</ion-button>
  </div>
</div>
