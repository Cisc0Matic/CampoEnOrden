<div class="auth-wrapper">
  <div class="auth-logo">
    <ion-icon name="lock-closed" color="primary"></ion-icon>
    <h1>Recuperar contraseña</h1>
    <p>Te enviamos un enlace a tu email</p>
  </div>

  <div *ngIf="sent" class="success-card">
    <ion-icon name="mail" color="success"></ion-icon>
    <p>Si el email está registrado, recibirás las instrucciones en breve.</p>
    <ion-button fill="clear" routerLink="/login">Volver al inicio de sesión</ion-button>
  </div>

  <form *ngIf="!sent" class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <ion-list lines="none">
      <ion-item>
        <ion-input
          label="Email"
          labelPlacement="stacked"
          formControlName="email"
          type="email"
          placeholder="tu@email.com"
          autocomplete="email"
        ></ion-input>
      </ion-item>
    </ion-list>

    <ion-button expand="block" type="submit" class="submit-btn" [disabled]="loading">
      <ion-spinner *ngIf="loading" name="dots"></ion-spinner>
      <span *ngIf="!loading">Enviar enlace</span>
    </ion-button>

    <ion-text color="danger" *ngIf="errorMessage" class="error-message">
      <p>{{ errorMessage }}</p>
    </ion-text>
  </form>

  <div class="auth-links">
    <a routerLink="/login">Volver al inicio de sesión</a>
  </div>
</div>
