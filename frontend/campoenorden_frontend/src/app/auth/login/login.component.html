<div class="login-wrapper">
  <div class="login-logo">
    <ion-icon name="leaf" color="primary"></ion-icon>
    <h1>CampoEnOrden</h1>
    <p>Gestión agrícola</p>
  </div>

  <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <ion-list lines="none">
      <ion-item>
        <ion-input
          label="Usuario"
          labelPlacement="stacked"
          formControlName="username"
          type="text"
          placeholder="Ingresá tu usuario"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Contraseña"
          labelPlacement="stacked"
          formControlName="password"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Ingresá tu contraseña"
        ></ion-input>
        <ion-icon
          slot="end"
          [name]="showPassword ? 'eye-off' : 'eye'"
          (click)="togglePassword()"
          class="password-icon"
        ></ion-icon>
      </ion-item>
    </ion-list>

    <ion-button expand="block" type="submit" class="submit-btn" [disabled]="loginForm.invalid || loading">
      <ion-spinner *ngIf="loading" name="dots"></ion-spinner>
      <span *ngIf="!loading">Iniciar sesión</span>
    </ion-button>

    <ion-text color="danger" *ngIf="errorMessage" class="error-message">
      <p>{{ errorMessage }}</p>
    </ion-text>

    <div *ngIf="cuentaInactiva" class="inactive-notice">
      <ion-text color="warning">
        <p>Tu cuenta todavía no fue activada. Revisá tu correo o reenviá el email de activación.</p>
      </ion-text>
      <ion-button expand="block" fill="outline" color="warning" [disabled]="reenvioLoading" (click)="reenviarActivacion()">
        <ion-spinner *ngIf="reenvioLoading" name="dots"></ion-spinner>
        <span *ngIf="!reenvioLoading">Reenviar email de activación</span>
      </ion-button>
    </div>

    <ion-text color="success" *ngIf="reenvioExito" class="error-message">
      <p>Email de activación reenviado. Revisá tu correo.</p>
    </ion-text>
  </form>

  <div class="auth-links">
    <a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
    <span class="separator">·</span>
    <a routerLink="/register">Crear cuenta nueva</a>
  </div>

  <div class="debug-section">
    <ion-button fill="clear" size="small" (click)="clearToken()">
      <ion-icon slot="start" name="refresh"></ion-icon>
      Limpiar sesión
    </ion-button>
  </div>
</div>
