<div class="auth-wrapper">
  <div class="auth-logo">
    <ion-icon name="person-add" color="primary"></ion-icon>
    <h1>Unirse a CampoEnOrden</h1>
  </div>

  <div *ngIf="checking" class="center">
    <ion-spinner name="dots"></ion-spinner>
  </div>

  <div *ngIf="!checking && errorMessage && !inviteInfo" class="error-card">
    <ion-icon name="close-circle" color="danger"></ion-icon>
    <p>{{ errorMessage }}</p>
    <ion-button fill="clear" routerLink="/login">Volver al inicio</ion-button>
  </div>

  <div *ngIf="done" class="success-card">
    <ion-icon name="checkmark-circle" color="success"></ion-icon>
    <p>Cuenta creada. Ya podés iniciar sesión.</p>
    <ion-button fill="clear" routerLink="/login">Iniciar sesión</ion-button>
  </div>

  <ng-container *ngIf="!checking && inviteInfo && !done">
    <div class="invite-info">
      <p>Fuiste invitado/a como <strong>{{ inviteInfo.role_display }}</strong></p>
      <p>Empresa: <strong>{{ inviteInfo.empresa }}</strong></p>
      <p class="email-label">{{ inviteInfo.email }}</p>
    </div>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <ion-list lines="none">
        <ion-item>
          <ion-input
            label="Nombre *"
            labelPlacement="stacked"
            formControlName="first_name"
            placeholder="Tu nombre"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            label="Apellido"
            labelPlacement="stacked"
            formControlName="last_name"
            placeholder="Tu apellido"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            label="Usuario *"
            labelPlacement="stacked"
            formControlName="username"
            placeholder="Nombre de usuario único"
            autocomplete="username"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            label="Contraseña *"
            labelPlacement="stacked"
            formControlName="password"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Mínimo 8 caracteres"
            autocomplete="new-password"
          ></ion-input>
          <ion-icon
            slot="end"
            [name]="showPassword ? 'eye-off' : 'eye'"
            (click)="togglePassword()"
            class="password-icon"
          ></ion-icon>
        </ion-item>
        <ion-item>
          <ion-input
            label="Confirmar contraseña *"
            labelPlacement="stacked"
            formControlName="password_confirm"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Repetí la contraseña"
            autocomplete="new-password"
          ></ion-input>
        </ion-item>
      </ion-list>

      <ion-button expand="block" type="submit" class="submit-btn" [disabled]="loading">
        <ion-spinner *ngIf="loading" name="dots"></ion-spinner>
        <span *ngIf="!loading">Crear mi cuenta</span>
      </ion-button>

      <ion-text color="danger" *ngIf="errorMessage" class="error-message">
        <p>{{ errorMessage }}</p>
      </ion-text>
    </form>
  </ng-container>
</div>
