<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>{{isEdit ? 'Editar' : 'Nuevo'}} Documento</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="guardar()" [disabled]="loading">
        <ion-icon slot="icon-only" name="checkmark"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="documentoForm" class="form-container">
    <ion-list>
      <ion-item>
        <ion-select label="Tipo" labelPlacement="stacked" formControlName="tipo" placeholder="Seleccionar tipo">
          <ion-select-option *ngFor="let t of tipos" [value]="t.value">{{t.label}}</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-item>
        <ion-input label="Número" labelPlacement="stacked" formControlName="numero" placeholder="Ej: FACT-00123"></ion-input>
      </ion-item>
      <ion-item>
        <ion-select label="Campo" labelPlacement="stacked" formControlName="campo" [compareWith]="compararPorId" placeholder="Seleccionar campo">
          <ion-select-option [value]="null">Ninguno</ion-select-option>
          <ion-select-option *ngFor="let c of campos" [value]="c.id">{{c.nombre}}</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-item>
        <ion-select label="Labor Vinculada" labelPlacement="stacked" formControlName="labor" [compareWith]="compararPorId" placeholder="Seleccionar labor">
          <ion-select-option [value]="null">Ninguna</ion-select-option>
          <ion-select-option *ngFor="let l of lotes" [value]="l.id">Labor en {{l.campo_nombre}}</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-item>
        <ion-select label="Flete Vinculado" labelPlacement="stacked" formControlName="flete" [compareWith]="compararPorId" placeholder="Seleccionar flete">
          <ion-select-option [value]="null">Ninguno</ion-select-option>
          <ion-select-option *ngFor="let f of fletes" [value]="f.id">CPE: {{f.nro_cpe}}</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-item>
        <ion-select label="Titular" labelPlacement="stacked" formControlName="titular" [compareWith]="compararPorId" placeholder="Seleccionar titular">
          <ion-select-option [value]="null">Ninguno</ion-select-option>
          <ion-select-option *ngFor="let p of personas" [value]="p.id">{{p.nombre}}</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-item>
        <ion-input label="Monto ($)" labelPlacement="stacked" type="number" formControlName="monto"></ion-input>
      </ion-item>
      <ion-item>
        <ion-select label="Estado" labelPlacement="stacked" formControlName="estado">
          <ion-select-option *ngFor="let e of estados" [value]="e.value">{{e.label}}</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-item>
        <ion-datetime label="Fecha Documento" labelPlacement="stacked" formControlName="fecha_documento" presentation="date"></ion-datetime>
      </ion-item>
      <ion-item>
        <ion-datetime label="Fecha Vencimiento" labelPlacement="stacked" formControlName="fecha_vencimiento" presentation="date"></ion-datetime>
      </ion-item>
      <ion-item>
        <ion-label>Archivo (PDF/Imagen)</ion-label>
        <input type="file" (change)="onFileChange($event)" accept=".pdf,.jpg,.jpeg,.png" />
      </ion-item>
      <ion-item>
        <ion-textarea label="Observaciones" labelPlacement="stacked" formControlName="observaciones" placeholder="Notas adicionales..." rows="4"></ion-textarea>
      </ion-item>
    </ion-list>

    <div class="error" *ngIf="error">
      <p>{{error}}</p>
    </div>

    <div class="form-actions">
      <ion-button expand="block" (click)="guardar()" [disabled]="loading">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        {{isEdit ? 'Actualizar' : 'Crear'}} Documento
      </ion-button>
      <ion-button expand="block" fill="clear" (click)="router.navigate(['/tabs/documentos'])">
        Cancelar
      </ion-button>
    </div>
  </form>
</ion-content>
