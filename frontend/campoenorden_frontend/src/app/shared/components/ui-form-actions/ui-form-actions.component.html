<div class="ceo-form-actions">
  <ion-button expand="block" (click)="submit.emit()" [disabled]="disabled || loading">
    <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
    {{loading ? 'Guardando...' : submitLabel}}
  </ion-button>
  <ion-button expand="block" fill="clear" (click)="cancel.emit()">
    Cancelar
  </ion-button>
</div>
