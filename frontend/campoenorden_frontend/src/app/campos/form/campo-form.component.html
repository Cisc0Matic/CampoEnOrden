<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>{{isEdit ? 'Editar' : 'Nuevo'}} Campo</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="guardar()" [disabled]="loading">
        <ion-icon slot="icon-only" name="checkmark"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="campoForm" class="form-container">
    <ion-list>
      <ion-item>
        <ion-input label="Nombre" labelPlacement="stacked" formControlName="nombre" placeholder="Ej: Campo San José"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Ubicación" labelPlacement="stacked" formControlName="ubicacion" placeholder="Ej: Ruta 8, Km 120"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Localidad" labelPlacement="stacked" formControlName="localidad" placeholder="Ej: Bell Ville"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Provincia" labelPlacement="stacked" formControlName="provincia" placeholder="Ej: Córdoba"></ion-input>
      </ion-item>
      <ion-item>
        <ion-select label="Productor" labelPlacement="stacked" formControlName="productor" interface="action-sheet" placeholder="Seleccionar productor">
          <ion-select-option *ngFor="let p of personas" [value]="p.id">{{p.nombre}}</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-item>
        <ion-input label="Superficie Total (ha)" labelPlacement="stacked" type="number" formControlName="superficie_total" placeholder="Ej: 100"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Superficie Trabajada (ha)" labelPlacement="stacked" type="number" formControlName="superficie_trabajada" placeholder="Ej: 80"></ion-input>
      </ion-item>
      <ion-item>
        <ion-select label="Estado del Contrato" labelPlacement="stacked" formControlName="estado_contrato">
          <ion-select-option *ngFor="let e of estados" [value]="e.value">{{e.label}}</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-item>
        <ion-select label="Locadores (Dueños)" labelPlacement="stacked" formControlName="locadores_ids" multiple="true" [compareWith]="compararPersona" placeholder="Seleccionar locadores">
          <ion-select-option *ngFor="let p of personas" [value]="p.id">{{p.nombre}} ({{p.documento}})</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-item>
        <ion-select label="Locatarios (Arrendatarios)" labelPlacement="stacked" formControlName="locatarios_ids" multiple="true" [compareWith]="compararPersona" placeholder="Seleccionar locatarios">
          <ion-select-option *ngFor="let p of personas" [value]="p.id">{{p.nombre}} ({{p.documento}})</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-item>
        <ion-input label="Costo Total ($)" labelPlacement="stacked" type="number" formControlName="costo_total"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Costo por ha ($)" labelPlacement="stacked" type="number" formControlName="costo_por_ha"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Margen ($)" labelPlacement="stacked" type="number" formControlName="margen"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Alquiler Pendiente ($)" labelPlacement="stacked" type="number" formControlName="alquiler_pendiente"></ion-input>
      </ion-item>
      <ion-item>
        <ion-textarea label="Condiciones de Alquiler" labelPlacement="stacked" formControlName="condiciones_alquiler" placeholder="Ej: Pago mensual, ajuste anual..." rows="4"></ion-textarea>
      </ion-item>
      <ion-item>
        <ion-textarea label="Observaciones" labelPlacement="stacked" formControlName="observaciones" placeholder="Notas adicionales..." rows="4"></ion-textarea>
      </ion-item>
    </ion-list>

    <div class="error" *ngIf="error">
      <p>{{error}}</p>
    </div>

    <div class="form-actions">
      <ion-button expand="block" (click)="guardar()" [disabled]="loading">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        {{isEdit ? 'Actualizar' : 'Crear'}} Campo
      </ion-button>
      <ion-button expand="block" fill="clear" (click)="router.navigate(['/tabs/campos'])">
        Cancelar
      </ion-button>
    </div>
  </form>
</ion-content>
