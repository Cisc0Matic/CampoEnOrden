<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>{{isEdit ? 'Editar' : 'Nuevo'}} Parámetro</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="guardar()" [disabled]="loading">
        <ion-icon slot="icon-only" name="checkmark"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="parametroForm" class="form-container">
    <ion-list>
      <ion-item>
        <ion-input label="Nombre" labelPlacement="stacked" formControlName="nombre" placeholder="Ej: Soja, Herbicida X..."></ion-input>
      </ion-item>
      <ion-item>
        <ion-select label="Categoría" labelPlacement="stacked" formControlName="categoria" placeholder="Seleccionar categoría">
          <ion-select-option *ngFor="let c of categorias" [value]="c.value">{{c.label}}</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-item>
        <ion-input label="Valor" labelPlacement="stacked" type="number" formControlName="valor"></ion-input>
      </ion-item>
      <ion-item>
        <ion-select label="Unidad" labelPlacement="stacked" formControlName="unidad" placeholder="Seleccionar unidad">
          <ion-select-option *ngFor="let u of unidades" [value]="u">{{u}}</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-item>
        <ion-select label="Campaña (para histórico)" labelPlacement="stacked" formControlName="campana" [compareWith]="compararPorId" placeholder="Seleccionar campaña">
          <ion-select-option [value]="null">Ninguna (Vigente)</ion-select-option>
          <ion-select-option *ngFor="let c of campanas" [value]="c.id">{{c.nombre}}</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-item>
        <ion-toggle labelPlacement="start" formControlName="vigente">Parámetro Vigente</ion-toggle>
      </ion-item>
    </ion-list>

    <div class="info">
      <ion-icon name="information-circle"></ion-icon>
      <p>Al crear una nueva versión de un parámetro con el mismo nombre, se mantendrá el histórico para campañas anteriores.</p>
    </div>

    <div class="error" *ngIf="error">
      <p>{{error}}</p>
    </div>

    <div class="form-actions">
      <ion-button expand="block" (click)="guardar()" [disabled]="loading">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        {{isEdit ? 'Actualizar' : 'Crear'}} Parámetro
      </ion-button>
      <ion-button expand="block" fill="clear" (click)="router.navigate(['/tabs/ajustes'])">
        Cancelar
      </ion-button>
    </div>
  </form>
</ion-content>
