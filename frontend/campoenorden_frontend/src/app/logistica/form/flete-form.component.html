<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>{{isEdit ? 'Editar' : 'Nuevo'}} Flete</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="guardar()" [disabled]="loading">
        <ion-icon slot="icon-only" name="checkmark"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="fleteForm" class="form-container">
    <ion-list>
      <ion-item>
        <ion-input label="Nro CPE" labelPlacement="stacked" formControlName="nro_cpe" placeholder="Ej: CPE-00123"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="CTG" labelPlacement="stacked" formControlName="ctg" placeholder="Ej: 12345678"></ion-input>
      </ion-item>
      <ion-item>
        <ion-select label="Lote" labelPlacement="stacked" formControlName="lote" [compareWith]="compararPorId" placeholder="Seleccionar lote">
          <ion-select-option *ngFor="let l of lotes" [value]="l.id">{{l.campo_nombre}} - {{l.cultivo_nombre}}</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-item>
        <ion-select label="Chofer" labelPlacement="stacked" formControlName="chofer" [compareWith]="compararPorId" placeholder="Seleccionar chofer">
          <ion-select-option [value]="null">Ninguno</ion-select-option>
          <ion-select-option *ngFor="let p of personas" [value]="p.id">{{p.nombre}}</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-item>
        <ion-input label="Patente Camión" labelPlacement="stacked" formControlName="patente_camion" placeholder="Ej: ABC123"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Patente Acoplado" labelPlacement="stacked" formControlName="patente_acoplado" placeholder="Ej: XYZ789"></ion-input>
      </ion-item>
      <ion-item>
        <ion-datetime label="Fecha/Hora Salida" labelPlacement="stacked" formControlName="fecha_hora_salida" presentation="date-time"></ion-datetime>
      </ion-item>
      <ion-item>
        <ion-datetime label="Fecha/Hora Llegada" labelPlacement="stacked" formControlName="fecha_hora_llegada" presentation="date-time"></ion-datetime>
      </ion-item>
      <ion-item>
        <ion-input label="Peso Origen (kg)" labelPlacement="stacked" type="number" formControlName="peso_origen"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Peso Destino (kg)" labelPlacement="stacked" type="number" formControlName="peso_destino"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Flete Corto ($)" labelPlacement="stacked" type="number" formControlName="flete_corto"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Flete Largo ($)" labelPlacement="stacked" type="number" formControlName="flete_largo"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Comisión ($)" labelPlacement="stacked" type="number" formControlName="comision"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Secada ($)" labelPlacement="stacked" type="number" formControlName="secada"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Cosecha ($)" labelPlacement="stacked" type="number" formControlName="cosecha"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Costo Comercial ($)" labelPlacement="stacked" type="number" formControlName="costo_comercial"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Destino" labelPlacement="stacked" formControlName="destino" placeholder="Ej: Acopio Central"></ion-input>
      </ion-item>
      <ion-item>
        <ion-select label="Estado" labelPlacement="stacked" formControlName="estado">
          <ion-select-option *ngFor="let e of estados" [value]="e.value">{{e.label}}</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-item>
        <ion-textarea label="Observaciones" labelPlacement="stacked" formControlName="observaciones" placeholder="Notas adicionales..." rows="4"></ion-textarea>
      </ion-item>
    </ion-list>

    <div class="costo-total">
      <h3>Costo Total Estimado: ${{getCostoTotal() | number:'1.0-0'}}</h3>
    </div>

    <div class="error" *ngIf="error">
      <p>{{error}}</p>
    </div>

    <div class="form-actions">
      <ion-button expand="block" (click)="guardar()" [disabled]="loading">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        {{isEdit ? 'Actualizar' : 'Crear'}} Flete
      </ion-button>
      <ion-button expand="block" fill="clear" (click)="router.navigate(['/tabs/logistica'])">
        Cancelar
      </ion-button>
    </div>
  </form>
</ion-content>
