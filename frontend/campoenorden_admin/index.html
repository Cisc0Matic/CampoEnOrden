<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampoEnOrden · Panel de Administración</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>

<!-- Modal genérico -->
<div id="modal-backdrop" class="hidden">
  <div id="modal" class="modal">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="icon-btn" id="modal-close" title="Cerrar">&times;</button>
    </div>
    <form id="modal-form" class="modal-body"></form>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="modal-cancel">Cancelar</button>
      <button class="btn btn-primary" id="modal-submit" type="button">Guardar</button>
    </div>
  </div>
</div>

<div id="toast-wrap"></div>
<script src="app.js"></script>
</body>
</html>
